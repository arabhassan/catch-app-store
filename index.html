<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Catch App — Everyday finds, smart choices</title>
<style>
:root{--gold:#d4af37;--light:#f3d77a;--ink:#111;--muted:#686868;--line:#e8e1d2}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.topbar{background:#111;color:var(--gold);text-align:center;padding:9px 14px;font-size:12px}.wrap{max-width:1180px;margin:auto;padding:0 22px}.header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px 0}.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:900}.logo{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,var(--gold),var(--light));display:grid;place-items:center}.header-actions{display:flex;gap:10px}.pill,.cart-btn{border:1px solid var(--line);border-radius:999px;background:white;padding:10px 14px;font-weight:700}.cart-btn{background:#111;color:var(--gold)}.hero{background:linear-gradient(120deg,#111,#3a3020);color:white;border-radius:28px;padding:45px 5.5%;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:24px}.eyebrow{color:var(--gold);font-weight:800;font-size:12px;letter-spacing:.12em}.hero h1{font-size:clamp(36px,5vw,62px);line-height:1.02;margin:12px 0 16px}.hero p{color:#e2dccf;line-height:1.7}.primary{background:#111;color:var(--gold);border:0;border-radius:999px;padding:13px 20px;font-weight:800;margin-top:10px}.primary:disabled{opacity:.6}.hero-art{min-height:245px;display:grid;place-items:center;position:relative}.orb{width:min(280px,75%);aspect-ratio:1;border-radius:45% 55% 60% 40%;background:linear-gradient(145deg,var(--gold),var(--light));display:grid;place-items:center;font-size:100px;transform:rotate(-8deg)}.float{position:absolute;background:white;border-radius:18px;padding:12px 15px;font-size:13px;font-weight:800}.float.one{top:14%;right:1%}.float.two{bottom:10%;left:0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:42px 0 18px}.section-head h2{margin:0}.section-head p{color:var(--muted);font-size:14px}.search{width:min(270px,48%);border:1px solid var(--line);border-radius:999px;padding:12px 15px}.categories{display:flex;gap:9px;overflow:auto;padding:2px 0 12px}.category{border:1px solid var(--line);background:white;border-radius:999px;padding:10px 15px;white-space:nowrap}.category.active{background:#111;color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.product{border:1px solid var(--line);border-radius:20px;padding:11px}.photo{height:180px;width:100%;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f5edda;position:relative}.photo img{width:100%;height:100%;object-fit:contain;padding:10px}.photo>span{font-size:58px}.product h3{font-size:15px;margin:13px 3px 5px}.desc{color:var(--muted);font-size:12px;line-height:1.5;min-height:35px;margin:0 3px}.product-bottom{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 2px}.price{font-weight:900}.add{border:0;background:#f5edda;border-radius:12px;width:37px;height:37px;font-size:21px}.notice{background:#fff8dd;border:1px solid #f4e6ae;border-radius:15px;padding:13px 15px;margin:22px 0;color:#66551b;font-size:13px;line-height:1.6}.footer{margin-top:55px;background:#111;color:white;padding:30px 0}.footer-inner{display:flex;justify-content:space-between;gap:20px;align-items:center}.footer p{color:#c8c1d4;font-size:13px}.empty{grid-column:1/-1;padding:45px;text-align:center;color:var(--muted)}.drawer-backdrop{position:fixed;inset:0;background:#17102070;z-index:9;display:none}.drawer{position:fixed;z-index:10;right:0;top:0;height:100dvh;width:min(430px,100%);background:white;padding:23px;display:none;overflow:auto;box-shadow:-15px 0 50px #0001}.drawer.open,.drawer-backdrop.open{display:block}.drawer-head{display:flex;align-items:center;justify-content:space-between}.close{border:0;border-radius:50%;width:37px;height:37px;font-size:20px}.cart-line{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.mini-photo{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;overflow:hidden}.mini-photo img{width:100%;height:100%;object-fit:contain}.cart-line h4{margin:0 0 4px;font-size:13px}.cart-line p{margin:0;color:var(--muted);font-size:12px}.qty{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}.qty button{border:1px solid var(--line);background:white;border-radius:7px}.total{display:flex;justify-content:space-between;font-weight:900;font-size:18px;padding:18px 0}.checkout{display:grid;gap:11px}.checkout label{font-size:12px;font-weight:800}.checkout input,.checkout select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:5px}.checkout .primary{width:100%}.smallprint{font-size:11px;color:var(--muted);line-height:1.5}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:white;padding:12px 18px;border-radius:999px;z-index:20;display:none;font-size:13px;max-width:90%;text-align:center}.toast.show{display:block}body[dir=rtl] .float.one{right:auto;left:1%}body[dir=rtl] .float.two{left:auto;right:0}body[dir=rtl] .drawer{right:auto;left:0}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr;padding:32px 7%}.hero-art{min-height:190px}.orb{width:190px;font-size:85px}.header{flex-wrap:wrap}.section-head{align-items:start;flex-wrap:wrap}.search{width:100%}}@media(max-width:430px){.wrap{padding:0 14px}.hero{padding:27px 20px}.hero h1{font-size:39px}.grid{gap:10px}.product{padding:8px}.photo{height:140px}.product h3{font-size:13px}.desc{font-size:11px}.footer-inner{display:block}}
</style></head><body>
<div class="topbar" id="topbar"></div><div class="wrap"><header class="header"><div class="brand"><span class="logo">✦</span><span>Catch App<span style="color:#d4af37">.</span></span></div><div class="header-actions"><button class="pill" id="langBtn">عربي</button><button class="cart-btn" id="openCart">🛍 <span id="cartLabel">Cart</span> (<span id="cartCount">0</span>)</button></div></header>
<section class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="heroTitle"></h1><p id="heroText"></p><button class="primary" id="shopNow"></button></div><div class="hero-art"><div class="orb">🎁</div><div class="float one" id="floatOne"></div><div class="float two" id="floatTwo"></div></div></section>
<div class="section-head" id="collection"><div><h2 id="productsTitle"></h2><p id="productsSubtitle"></p></div><input class="search" id="search" type="search" aria-label="Search products"></div><div class="categories" id="categories"></div><div class="grid" id="products"></div><div class="notice" id="notice"></div></div>
<footer class="footer"><div class="wrap footer-inner"><div><div class="brand"><span class="logo">✦</span><span>Catch App<span style="color:#d4af37">.</span></span></div><p id="footerText"></p></div><p>© <span id="year"></span> Catch App · <span id="footerDemo"></span></p></div></footer>
<div class="drawer-backdrop" id="backdrop"></div><aside class="drawer" id="drawer"><div class="drawer-head"><h2 id="cartTitle"></h2><button class="close" id="closeCart">×</button></div><div id="cartItems"></div><div class="total"><span id="totalLabel"></span><span id="subtotal">$0.00</span></div><div class="checkout"><h3 id="checkoutTitle"></h3><p class="smallprint" id="checkoutInfo"></p><label><span id="nameLabel"></span><input id="customerName" autocomplete="name" maxlength="120"></label><label><span id="phoneLabel"></span><input id="customerPhone" autocomplete="tel" maxlength="40" placeholder="+961 ..."></label><label><span id="areaLabel"></span><select id="customerArea"><option value="">Choose an area</option><option>Beirut</option><option>Mount Lebanon</option><option>North Lebanon</option><option>South Lebanon</option><option>Bekaa</option><option>Nabatieh</option><option>Akkar</option><option>Baalbek-Hermel</option></select></label><label><span id="addressLabel"></span><input id="customerAddress" autocomplete="street-address" maxlength="300"></label><label><span id="notesLabel"></span><input id="customerNotes" maxlength="1000"></label><button class="primary" id="placeOrder"></button><p class="smallprint" id="privacyText"></p></div></aside><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const SUPABASE_URL="https://mjsaprouhtfrqandrnck.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_nHciMKhBrdSlVs3Z09CYBQ_VrinSh7";
const EDGE_FUNCTION_URL=SUPABASE_URL+"/functions/v1/submit-order";
let productsData=[],cats=["All"],lang="en",selectedCat="All",cart={},submitting=false;
const catAr={"All":"الكل"};
const translations={
en:{topbar:"A little something for everyone ✦ Cash on delivery in Lebanon",eyebrow:"YOUR NEXT LITTLE OBSESSION",heroTitle:"Good finds.<br>Happy days.",heroText:"Discover colorful everyday favorites, thoughtful gifts and clever little things — all in one place.",shopNow:"Explore the collection →",productsTitle:"Find your favorites",productsSubtitle:"A little mix of things worth discovering.",search:"Search products...",notice:"Please confirm product availability, final price and delivery fee before accepting orders.",cart:"Cart",cartTitle:"Your cart",total:"Subtotal",checkoutTitle:"Delivery details",checkoutInfo:"Your order details will be sent securely to Catch App.",name:"Full name",phone:"Phone / WhatsApp",area:"Delivery area",address:"Detailed address",notes:"Notes (optional)",placeOrder:"Place order",privacy:"Cash on delivery. Please check your details before submitting.",empty:"Your cart is empty. Add something you love!",remove:"Remove",footer:"Everyday finds. Smart choices.",footerDemo:"Cash on delivery",floatOne:"✨ New discoveries",floatTwo:"💛 Picked for you",choose:"Choose an area",added:"Added to cart",need:"Please add a product first.",form:"Please fill in your name, phone, area and address.",sending:"Submitting your order…",success:"Order submitted successfully! Order #",failed:"We couldn't submit your order. Please try again.",noProducts:"No products available right now."},
ar:{topbar:"شيء جميل لكل شخص ✦ الدفع عند الاستلام في لبنان",eyebrow:"اكتشف شيئاً تحبه",heroTitle:"اكتشافات جميلة.<br>أيام أجمل.",heroText:"اكتشف منتجات يومية ملوّنة وهدايا مميزة وأغراضاً عملية — كلها في مكان واحد.",shopNow:"اكتشف المجموعة ←",productsTitle:"اختر ما يعجبك",productsSubtitle:"مجموعة متنوعة من الأشياء التي تستحق الاكتشاف.",search:"ابحث عن المنتجات...",notice:"تأكد من توفر المنتج وسعره النهائي وكلفة التوصيل قبل قبول الطلبات.",cart:"السلة",cartTitle:"سلة التسوق",total:"المجموع الفرعي",checkoutTitle:"تفاصيل التوصيل",checkoutInfo:"سيتم إرسال تفاصيل طلبك بأمان إلى Catch App.",name:"الاسم الكامل",phone:"الهاتف / واتساب",area:"منطقة التوصيل",address:"العنوان بالتفصيل",notes:"ملاحظات (اختياري)",placeOrder:"إرسال الطلب",privacy:"الدفع عند الاستلام. يرجى التأكد من التفاصيل قبل إرسال الطلب.",empty:"السلة فارغة. أضف شيئاً يعجبك!",remove:"حذف",footer:"اكتشافات صغيرة، فرحة كبيرة.",footerDemo:"الدفع عند الاستلام",floatOne:"✨ اكتشافات جديدة",floatTwo:"💛 اخترناها لك",choose:"اختر المنطقة",added:"أُضيف إلى السلة",need:"أضف منتجاً أولاً.",form:"يرجى إدخال الاسم والهاتف والمنطقة والعنوان.",sending:"جارٍ إرسال طلبك…",success:"تم إرسال الطلب بنجاح! رقم الطلب ",failed:"تعذر إرسال الطلب. يرجى المحاولة مجدداً.",noProducts:"لا توجد منتجات متاحة حالياً."}
};
const $=id=>document.getElementById(id),money=n=>"$"+Number(n).toFixed(2),tr=k=>translations[lang][k]||k,productText=p=>p[lang]||p.en;
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$("toast").classList.remove("show"),3500)}
function renderCats(){$("categories").innerHTML=cats.map(c=>`<button class="category ${selectedCat===c?"active":""}" data-cat="${escapeHtml(c)}">${lang==="ar"?(catAr[c]||c):c}</button>`).join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{selectedCat=b.dataset.cat;renderCats();renderProducts()})}
function renderProducts(){const q=$("search").value.trim().toLowerCase(),list=productsData.filter(p=>(selectedCat==="All"||p.cat===selectedCat)&&(`${p.en.name} ${p.ar.name} ${p.en.desc} ${p.ar.desc} ${p.cat}`.toLowerCase().includes(q)));$("products").innerHTML=list.length?list.map(p=>`<article class="product"><div class="photo" style="background:${p.bg}">${p.image_url?`<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(productText(p).name)}">`:`<span>${p.emoji||"🛍️"}</span>`}</div><h3>${escapeHtml(productText(p).name)}</h3><p class="desc">${escapeHtml(productText(p).desc)}</p><div class="product-bottom"><span class="price">${money(p.price)}</span><button class="add" data-add="${p.id}" aria-label="Add ${escapeHtml(productText(p).name)}">+</button></div></article>`).join(""):`<div class="empty">${tr("noProducts")}</div>`;document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const id=Number(b.dataset.add);cart[id]=(cart[id]||0)+1;renderCart();toast(tr("added"))})}
function renderCart(){const entries=Object.entries(cart).filter(([id,q])=>q>0);$("cartCount").textContent=entries.reduce((s,[id,q])=>s+q,0);$("cartItems").innerHTML=entries.length?entries.map(([id,qty])=>{const p=productsData.find(x=>x.id===Number(id));if(!p)return "";return `<div class="cart-line"><div class="mini-photo" style="background:${p.bg}">${p.image_url?`<img src="${escapeHtml(p.image_url)}" alt="">`:p.emoji||"🛍️"}</div><div><h4>${escapeHtml(productText(p).name)}</h4><p>${money(p.price)} × ${qty}</p><div class="qty"><button data-change="${id}" data-delta="-1">−</button><span>${qty}</span><button data-change="${id}" data-delta="1">+</button><button data-remove="${id}">${tr("remove")}</button></div></div><strong>${money(p.price*qty)}</strong></div>`}).join(""):`<div class="empty">${tr("empty")}</div>`;const sum=entries.reduce((s,[id,q])=>s+(productsData.find(p=>p.id===Number(id))?.price||0)*q,0);$("subtotal").textContent=money(sum);document.querySelectorAll("[data-change]").forEach(b=>b.onclick=()=>{const id=b.dataset.change;cart[id]=(cart[id]||0)+Number(b.dataset.delta);if(cart[id]<=0)delete cart[id];renderCart()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{delete cart[b.dataset.remove];renderCart()})}
function applyLanguage(){document.documentElement.lang=lang;document.body.dir=lang==="ar"?"rtl":"ltr";const t=translations[lang],map={topbar:"topbar",eyebrow:"eyebrow",heroText:"heroText",productsTitle:"productsTitle",productsSubtitle:"productsSubtitle",notice:"notice",cartTitle:"cartTitle",totalLabel:"total",checkoutTitle:"checkoutTitle",checkoutInfo:"checkoutInfo",nameLabel:"name",phoneLabel:"phone",areaLabel:"area",addressLabel:"address",notesLabel:"notes",placeOrder:"placeOrder",privacyText:"privacy",footerText:"footer",footerDemo:"footerDemo",floatOne:"floatOne",floatTwo:"floatTwo"};Object.entries(map).forEach(([id,k])=>$(id).innerHTML=t[k]);$("heroTitle").innerHTML=t.heroTitle;$("shopNow").textContent=t.shopNow;$("cartLabel").textContent=t.cart;$("search").placeholder=t.search;$("search").dir=lang==="ar"?"rtl":"ltr";$("langBtn").textContent=lang==="en"?"عربي":"English";$("customerName").placeholder=lang==="en"?"Your name":"اسمك";$("customerPhone").placeholder="+961 ...";$("customerAddress").placeholder=lang==="en"?"Street, building, floor":"الشارع، المبنى، الطابق";$("customerNotes").placeholder=lang==="en"?"Delivery instructions":"تعليمات التوصيل";$("customerArea").options[0].textContent=t.choose;renderCats();renderProducts();renderCart()}
function openCart(){$("drawer").classList.add("open");$("backdrop").classList.add("open")}function closeCart(){$("drawer").classList.remove("open");$("backdrop").classList.remove("open")}
async function loadSupabaseProducts(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,name,description,price,category,image_url,available&available=eq.true&order=id.asc`,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${SUPABASE_PUBLISHABLE_KEY}`}});if(!r.ok)throw Error("Products request failed: "+r.status);const rows=await r.json();productsData=rows.map(p=>({id:Number(p.id),cat:p.category||"Other",emoji:"🛍️",image_url:p.image_url||"",bg:"#f5edda",price:Number(p.price),en:{name:p.name||"Product",desc:p.description||""},ar:{name:p.name||"Product",desc:p.description||""}}));cats=["All",...new Set(rows.map(p=>p.category).filter(Boolean))];selectedCat="All";cart={};renderCats();renderProducts();renderCart()}catch(e){console.error(e);$("products").innerHTML=`<div class="empty">${tr("noProducts")}</div>`}}
async function placeOrder(){if(submitting)return;if(!Object.values(cart).some(q=>q>0)){toast(tr("need"));return}if(!$("customerName").value.trim()||!$("customerPhone").value.trim()||!$("customerArea").value||!$("customerAddress").value.trim()){toast(tr("form"));return}const items=Object.entries(cart).filter(([id,q])=>q>0).map(([id,quantity])=>({id:Number(id),quantity:Number(quantity)}));if(items.some(i=>!Number.isSafeInteger(i.id)||!Number.isSafeInteger(i.quantity)||i.quantity<1||i.quantity>50)){toast(tr("failed"));return}const payload={name:$("customerName").value.trim(),phone:$("customerPhone").value.trim(),area:$("customerArea").value,address:$("customerAddress").value.trim(),notes:$("customerNotes").value.trim(),items};submitting=true;const btn=$("placeOrder");btn.disabled=true;btn.textContent=tr("sending");try{const r=await fetch(EDGE_FUNCTION_URL,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${SUPABASE_PUBLISHABLE_KEY}`,"Content-Type":"application/json"},body:JSON.stringify(payload)});let data={};try{data=await r.json()}catch{}if(!r.ok||data.success!==true){console.error("Order failed",r.status,data);toast(data.error||tr("failed"));return}cart={};renderCart();["customerName","customerPhone","customerArea","customerAddress","customerNotes"].forEach(id=>$(id).value="");closeCart();toast(tr("success")+data.order_id)}catch(e){console.error(e);toast(tr("failed"))}finally{submitting=false;btn.disabled=false;btn.textContent=tr("placeOrder")}}
$("langBtn").onclick=()=>{lang=lang==="en"?"ar":"en";applyLanguage()};$("openCart").onclick=openCart;$("closeCart").onclick=closeCart;$("backdrop").onclick=closeCart;$("search").addEventListener("input",renderProducts);$("shopNow").onclick=()=>$("collection").scrollIntoView({behavior:"smooth"});$("placeOrder").onclick=placeOrder;$("year").textContent=new Date().getFullYear();applyLanguage();loadSupabaseProducts();
</script></body></html>
